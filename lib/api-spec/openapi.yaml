openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: chainlens
    description: Blockscout-backed wallet investigation
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /blockscout/status:
    get:
      operationId: getBlockscoutStatus
      tags: [chainlens]
      summary: Check Blockscout API configuration
      responses:
        "200":
          description: API configuration status
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BlockscoutStatus"
  /wallets/{address}/overview:
    get:
      operationId: getWalletOverview
      tags: [chainlens]
      summary: Get balances, lifetime counters, linkability score, historical charts, and recent transactions across 10+ supported chains
      parameters:
        - name: address
          in: path
          required: true
          schema:
            type: string
            pattern: "^0x[a-fA-F0-9]{40}$"
      responses:
        "200":
          description: Multichain wallet overview
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WalletOverview"
        "400":
          description: Invalid wallet address
        "503":
          description: Blockscout API key is not configured
        "502":
          description: Blockscout API request failed
  /addresses/{address}/metadata:
    get:
      operationId: getAddressMetadata
      tags: [chainlens]
      summary: Get public identity metadata for an address
      parameters:
        - name: address
          in: path
          required: true
          schema:
            type: string
            pattern: "^0x[a-fA-F0-9]{40}$"
      responses:
        "200":
          description: Address metadata
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AddressMetadata"
        "400":
          description: Invalid wallet address
        "503":
          description: Blockscout API key is not configured
        "502":
          description: Blockscout metadata request failed
components:
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status
    BlockscoutStatus:
      type: object
      properties:
        configured:
          type: boolean
      required: [configured]
    WalletOverview:
      type: object
      properties:
        address:
          type: string
        chains:
          type: array
          items:
            $ref: "#/components/schemas/ChainWallet"
        totalLifetimeTransactions:
          type: integer
        totalLifetimeTokenTransfers:
          type: integer
        approvals:
          type: array
          items:
            $ref: "#/components/schemas/ApprovalFinding"
        poisoningMatches:
          type: array
          items:
            $ref: "#/components/schemas/PoisoningFinding"
        linkability:
          $ref: "#/components/schemas/LinkabilitySummary"
        history:
          type: array
          items:
            $ref: "#/components/schemas/HistoricalPoint"
      required: [address, chains]
    ChainWallet:
      type: object
      properties:
        chainId:
          type: integer
        chainName:
          type: string
        nativeSymbol:
          type: string
        nativeBalance:
          type: ["string", "null"]
        nativePriceUsd:
          type: ["number", "null"]
        tokens:
          type: array
          items:
            $ref: "#/components/schemas/TokenBalance"
        tokenBalancesIncomplete:
          type: boolean
        transactions:
          type: array
          items:
            $ref: "#/components/schemas/WalletTransaction"
        explorerUrl:
          type: string
        addressExplorerUrl:
          type: string
        totalTransactionsCount:
          type: integer
        totalTokenTransfersCount:
          type: integer
      required:
        - chainId
        - chainName
        - nativeSymbol
        - nativeBalance
        - nativePriceUsd
        - tokens
        - tokenBalancesIncomplete
        - transactions
    TokenBalance:
      type: object
      properties:
        address:
          type: string
        name:
          type: string
        symbol:
          type: string
        decimals:
          type: integer
        balance:
          type: string
        priceUsd:
          type: ["number", "null"]
        valueUsd:
          type: ["number", "null"]
        iconUrl:
          type: ["string", "null"]
      required:
        - address
        - name
        - symbol
        - decimals
        - balance
        - priceUsd
        - valueUsd
        - iconUrl
    WalletTransaction:
      type: object
      properties:
        hash:
          type: string
        timestamp:
          type: string
          format: date-time
        from:
          type: string
        to:
          type: ["string", "null"]
        value:
          type: string
        method:
          type: ["string", "null"]
        status:
          type: string
      required: [hash, timestamp, from, to, value, method, status]
    ApprovalFinding:
      type: object
      properties:
        chainId:
          type: integer
        chainName:
          type: string
        hash:
          type: string
        timestamp:
          type: string
        tokenAddress:
          type: string
        spenderAddress:
          type: string
        allowanceType:
          type: string
          enum: [unlimited, bounded, revoked]
        formattedAllowance:
          type: string
        method:
          type: string
        txExplorerUrl:
          type: string
        tokenExplorerUrl:
          type: string
        spenderExplorerUrl:
          type: string
      required:
        - chainId
        - chainName
        - hash
        - timestamp
        - tokenAddress
        - spenderAddress
        - allowanceType
        - formattedAllowance
        - method
        - txExplorerUrl
        - tokenExplorerUrl
        - spenderExplorerUrl
    PoisoningFinding:
      type: object
      properties:
        chainId:
          type: integer
        chainName:
          type: string
        hash:
          type: string
        timestamp:
          type: string
        suspiciousAddress:
          type: string
        mimickedAddress:
          type: string
        prefixMatch:
          type: integer
        suffixMatch:
          type: integer
        isZeroValue:
          type: boolean
        txExplorerUrl:
          type: string
        suspiciousExplorerUrl:
          type: string
        mimickedExplorerUrl:
          type: string
      required:
        - chainId
        - chainName
        - hash
        - timestamp
        - suspiciousAddress
        - mimickedAddress
        - prefixMatch
        - suffixMatch
        - isZeroValue
        - txExplorerUrl
        - suspiciousExplorerUrl
        - mimickedExplorerUrl
    SharedCounterparty:
      type: object
      properties:
        address:
          type: string
        chains:
          type: array
          items:
            type: string
        txCount:
          type: integer
        explorerUrl:
          type: string
      required: [address, chains, txCount, explorerUrl]
    LinkabilitySummary:
      type: object
      properties:
        score:
          type: number
        level:
          type: string
          enum: [Low, Moderate, High, Critical]
        activeChainCount:
          type: integer
        sharedCounterpartyCount:
          type: integer
        temporalOverlapCount:
          type: integer
        hasPublicIdentity:
          type: boolean
        sharedCounterparties:
          type: array
          items:
            $ref: "#/components/schemas/SharedCounterparty"
      required:
        - score
        - level
        - activeChainCount
        - sharedCounterpartyCount
        - temporalOverlapCount
        - hasPublicIdentity
        - sharedCounterparties
    HistoricalPoint:
      type: object
      properties:
        date:
          type: string
        txCount:
          type: integer
        volumeUsd:
          type: number
        cumulativeVolumeUsd:
          type: number
        activeChains:
          type: integer
      required: [date, txCount, volumeUsd, cumulativeVolumeUsd, activeChains]
    AddressMetadata:
      type: object
      properties:
        address:
          type: string
        name:
          type: ["string", "null"]
        ensName:
          type: ["string", "null"]
        website:
          type: ["string", "null"]
        tags:
          type: array
          items:
            type: string
        iconUrl:
          type: ["string", "null"]
        hasMetadata:
          type: boolean
      required: [address, name, ensName, website, tags, iconUrl, hasMetadata]