name: Keep-Alive Ping

on:
  schedule:
    # Runs every 10 minutes
    - cron: '*/10 * * * *'
  workflow_dispatch: # Allows you to run this workflow manually from the Actions tab

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping the backend health check & Blockscout status endpoints
        run: |
          curl -fsSL --retry 3 --retry-delay 5 --max-time 25 "https://chainlens-ac6q.onrender.com/api/healthz" > /dev/null || true
          curl -fsSL --max-time 20 "https://chainlens-ac6q.onrender.com/api/blockscout/status" > /dev/null || true