kind = "web"
previewPath = "/"
title = "ChainLens"
description = "A multichain wallet investigation dashboard for exploring token holdings, transaction risks, and address identity across Ethereum, Base, Optimism, and Arbitrum."
version = "1.0.0"
id = "artifacts/chainlens"
router = "path"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 25698

[services.development]
run = "pnpm --filter @workspace/chainlens run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/chainlens", "run", "build" ]
serve = "static"
publicDir = "artifacts/chainlens/dist/public"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "25698"
BASE_PATH = "/"
